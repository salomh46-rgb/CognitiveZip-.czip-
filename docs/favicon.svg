<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="czipGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#05070E" />
    </radialGradient>
    
    <!-- Neon Border Beam -->
    <linearGradient id="neonBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Zipper Metallic Gradient -->
    <linearGradient id="metalZip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- AI Synapse Lightning Gradient -->
    <linearGradient id="synapseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <filter id="neonDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Icon Shape -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#czipGlow)" stroke="url(#neonBeam)" stroke-width="2.5" />

  <!-- Background Data Tracks (Micro Grid Lines) -->
  <line x1="24" y1="36" x2="104" y2="36" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="24" y1="92" x2="104" y2="92" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Zipper Track (Upper Section - Archival Compression) -->
  <!-- Teeth Alternating Left & Right -->
  <rect x="54" y="22" width="9" height="5" rx="1.5" fill="url(#metalZip)" />
  <rect x="65" y="27" width="9" height="5" rx="1.5" fill="url(#metalZip)" />
  <rect x="54" y="33" width="9" height="5" rx="1.5" fill="url(#metalZip)" />
  <rect x="65" y="39" width="9" height="5" rx="1.5" fill="url(#metalZip)" />
  <rect x="54" y="45" width="9" height="5" rx="1.5" fill="url(#metalZip)" />

  <!-- The Cognitive Core Slider (Zipper Pull / AI Diamond Quantum Unit) -->
  <!-- Outer Glow Halo -->
  <circle cx="64" cy="62" r="18" fill="#8B5CF6" opacity="0.25" filter="url(#neonDrop)" />
  
  <!-- Slider Body -->
  <path d="M52 54 L76 54 L71 74 L64 78 L57 74 Z" fill="#1E1B4B" stroke="url(#neonBeam)" stroke-width="2" />

  <!-- AI Brain / Cognitive Synapse Nodes Inside Zipper Slider -->
  <circle cx="64" cy="63" r="3.5" fill="#06B6D4" filter="url(#neonDrop)" />
  <circle cx="59" cy="59" r="1.8" fill="#A855F7" />
  <circle cx="69" cy="59" r="1.8" fill="#A855F7" />
  <line x1="59" y1="59" x2="64" y2="63" stroke="#22D3EE" stroke-width="1.2" />
  <line x1="69" y1="59" x2="64" y2="63" stroke="#22D3EE" stroke-width="1.2" />

  <!-- Lightning / Instant Sub-ms Stream Ray bursting out downwards -->
  <!-- Open Zipper Diverging Rays -->
  <path d="M60 76 L38 106" stroke="url(#synapseGlow)" stroke-width="3" stroke-linecap="round" filter="url(#neonDrop)" />
  <path d="M68 76 L90 106" stroke="url(#synapseGlow)" stroke-width="3" stroke-linecap="round" filter="url(#neonDrop)" />
  
  <!-- Instant Neural Pulse Sparks -->
  <polygon points="64,80 61,91 66,91 63,104 70,89 65,89" fill="#06B6D4" filter="url(#neonDrop)" />

  <!-- Secondary Stream Points (Bits floating) -->
  <circle cx="36" cy="106" r="2.5" fill="#06B6D4" />
  <circle cx="92" cy="106" r="2.5" fill="#A855F7" />
  <circle cx="48" cy="94" r="1.5" fill="#10B981" />
  <circle cx="80" cy="94" r="1.5" fill="#10B981" />
</svg>
